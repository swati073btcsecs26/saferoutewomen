services:
  backend:
    build:
      context: ./backend
    container_name: saferoute-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: saferoute-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
