server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: let React Router-style paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Forward API calls to the backend container.
    # The frontend code calls "/api/..." by default (see frontend/src/api.js),
    # so no extra configuration is needed on the client side.
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
